<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .person {
      display: flex;
      justify-content: space-around;
    }

    .man, .woman {
      width: 50px;
      height: 150px;
      position: relative;
    }

    .man::before, .woman::before {
      content: '';
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: #6C757D;
      bottom: 0;
    }

    .man::after {
      content: '';
      position: absolute;
      width: 5px;
      height: 80px;
      background-color: #6C757D;
      left: 50%;
      bottom: 50px;
      transform: translateX(-50%);
    }

    .woman::after {
      content: '';
      position: absolute;
      width: 5px;
      height: 80px;
      background-color: #6C757D;
      left: 50%;
      bottom: 50px;
      transform: translateX(-50%);
    }

    .woman::before {
      content: '';
      position: absolute;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background-color: #F08080;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <div class="person">
    <div class="man"></div>
    <div class="woman"></div>
  </div>
</body>
</html>
